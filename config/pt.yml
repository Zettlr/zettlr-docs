    - Espaços de trabalho e arquivos raiz: file-manager/workspaces-root-files.md
    - Escolhendo quais arquivos mostrar: file-manager/choosing-files.md
    - Aparência (modos): file-manager/appearance.md
    - Lista de arquivos: file-manager/file-list.md
    - Propriedades: file-manager/properties.md
    - Filtragem: file-manager/filtering.md
    - Pesquisa global: file-manager/search.md
    - Projetos: file-manager/projects.md
  - Exibição dividida:
