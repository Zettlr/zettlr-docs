  - Científico e técnico:
    - Científico e técnico: scientific-technical/index.md
    - Matemática: scientific-technical/math.md
    - Blocos de código: scientific-technical/code-blocks.md
    - Diagramas Mermaid: scientific-technical/mermaid.md
    - Temporizador Pomodoro: scientific-technical/pomodoro.md
    - Estatísticas de escrita: scientific-technical/writing-statistics.md
  - PKMS/Zettelkasten:
    - PKMS/Zettelkasten: pkms/index.md
    - Métodos de Zettelkasten: pkms/zkn-method.md
    - Visualização de grafo: pkms/graph.md
