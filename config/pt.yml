    - Sumário: sidebar/table-of-contents.md
    - Referências: sidebar/bibliography.md
    - Arquivos relacionados: sidebar/related-files.md
    - Outros arquivos: sidebar/other-files.md
  - Editor Markdown:
    - Editor Markdown: editor/index.md
    - Compêndio Markdown: editor/markdown-compendium.md
    - Aparência: editor/appearance.md
    - Pesquisa: editor/search.md
    - Autocompletar: editor/autocomplete.md
    - Notas de rodapé: editor/footnotes.md
    - Citações: editor/citations.md
    - Trabalhando com comentários: editor/comments.md
    - Barra de status: editor/statusbar.md
    - Editor de tabelas: editor/tables.md
    - Transformações de texto: editor/text-transforms.md
    - Trechos: editor/snippets.md
    - YAML Front Matter: editor/yaml-frontmatter.md
  - Idioma e estilo:
    - Idioma e estilo: language-style/index.md
    - Verificação ortográfica: language-style/spellchecking.md
    - LanguageTool: language-style/languagetool.md
    - Sintaxe Markdown: language-style/syntax.md
    - Autocorreção e MagicQuotes: language-style/autocorrect.md
