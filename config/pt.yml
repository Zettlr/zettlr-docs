    - Espaços de trabalho: first-time-users/workspaces.md
    - Criando arquivos e pastas: first-time-users/creating-files-and-folders.md
    - Escrevendo Markdown: first-time-users/writing-markdown.md
    - Migrando do Word: first-time-users/import.md
    - Exportando arquivos: first-time-users/exporting-files.md
  - Gerenciador de arquivos:
