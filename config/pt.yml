site_name: Manual do Usuário do Zettlr
site_url: https://docs.zettlr.com/pt
repo_url: https://github.com/Zettlr/zettlr-docs
site_description: >-
    Nossa documentação abrangente fornece tudo o que você precisa saber sobre como
    aproveitar ao máximo o Zettlr.
site_author: Hendrik Erz
copyright: "&copy; 2017-2026 by Zettlr"
docs_dir: ../docs/pt
site_dir: ../build/pt
edit_uri: edit/master/docs/pt
extra_css:
  - assets/app.css
nav:
