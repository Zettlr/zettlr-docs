  - Guias:
    - Guias: guides/index.md
    - Personalizando o Zettlr com CSS: guides/custom-css.md
    - Integração com Zotero: guides/reference-manager-integration.md
    - LanguageTool localmente: guides/languagetool-local.md
    - Apresentações: guides/presentations.md
    - Submetendo a um periódico usando um modelo LaTeX: guides/journal-latex-template.md
