  - Referência:
    - Referência: reference/index.md
    - Atalhos de teclado: reference/keyboard-shortcuts.md
    - Configurações: reference/settings.md
theme:
  name: readthedocs
  locale: pt
  custom_dir: ../theme_override
  highlightjs: True
  hljs_style: github
  hljs_style_dark: github_dark
  prev_next_buttons_location: both
  hljs_languages:
    - javascript
    - markdown
    - css
    - yaml
    - latex
    - lua
markdown_extensions:
    - def_list
    - admonition
    - toc:
        permalink: True
plugins:
  - search:
      lang: pt-br
  - git-revision-date-localized
validation:
  omitted_files: warn
  absolute_links: warn  # Or 'relative_to_docs' - new in MkDocs 1.6
  unrecognized_links: warn
  anchors: warn  # New in MkDocs 1.6
